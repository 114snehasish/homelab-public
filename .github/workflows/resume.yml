name: Resume the Lab

# Resume = apply compute/vm -> wait for cloud-init -> verify the mount guard,
# the containers and the edge (#101, ADR-0009 §5). The mirror of park.yml:
# compute only. If the lab was taken down with destroy.yml (which also removes
# the Cloudflare delegation), use deploy.yml instead — it runs the same verify.
#
# A thin dispatcher; the logic lives in _resume.yml, which deploy.yml's compute
# leg calls too. apply unchecked (the default) only plans.
#
# Dispatch from main (OIDC subject), like every workflow here.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Resume for real (apply compute/vm, then verify). Unchecked = plan only.'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  # See park.yml.
  group: homelab-terraform
  queue: max

jobs:
  resume:
    name: Resume
    uses: ./.github/workflows/_resume.yml
    secrets: inherit
    with:
      apply: ${{ inputs.apply == true }}
