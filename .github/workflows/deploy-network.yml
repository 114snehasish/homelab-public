name: Deploy Network

on:
  workflow_dispatch:
    inputs:
      ssh_source_ip:
        description: 'The IP address to whitelist for SSH access (e.g., 1.2.3.4/32). Leave empty to use the runner IP (not recommended as it changes).'
        required: false
        type: string
      apply:
        description: 'Applying the changes'
        type: boolean
        default: false
  workflow_call:
    inputs:
      ssh_source_ip:
        required: false
        type: string
      apply:
        required: false
        type: boolean
        default: false
  # Pinned to main: a push run's OIDC subject is
  # `repo:114snehasish/homelab:ref:refs/heads/<branch>`, and the only federated
  # credentials are for `:ref:refs/heads/main` and `:pull_request` (E02.3, #35).
  # A feature-branch push could only ever fail at Azure auth; the `pull_request`
  # trigger below is what gives a branch its plan.
  push:
    branches: [main]
    paths:
      - 'infra/network/**'
      - '.github/workflows/deploy-network.yml'
  pull_request:
    paths:
      - 'infra/network/**'
      - '.github/workflows/deploy-network.yml'

permissions:
  contents: read
  pull-requests: write
  # _terraform.yml declares id-token: write for its OIDC path; a caller
  # granting less than the workflow it calls fails the run at startup.
  id-token: write

jobs:
  terraform:
    name: Terraform Network
    uses: ./.github/workflows/_terraform.yml
    secrets: inherit
    with:
      working_directory: infra/network
      ssh_source_ip: ${{ inputs.ssh_source_ip }}
      apply: ${{ inputs.apply == true }}
