name: Terraform (reusable)

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Path to the Terraform root module (e.g. infra/network)'
        required: true
        type: string
      # Split out of working_directory by E17.4 (#163). That one input used to
      # be the checkout path, the state identity, the lock identity and the
      # PR-comment identity all at once, which is exactly why one module could
      # not be planned twice.
      #
      # Empty (the default) means the module hardcodes its own `key` in
      # backend.tf and init runs bare — true for all five modules except
      # compute/vm, which moved to partial backend config. Set it and init
      # gets -backend-config="key=<state_key>"; it then also becomes this
      # job's lock identity and PR-comment identity, so two instances of one
      # module neither collide on the state blob nor overwrite each other's
      # sticky comment.
      state_key:
        description: 'Backend state blob key (e.g. homelab.compute.tfstate). Empty = the module hardcodes its key in backend.tf.'
        required: false
        type: string
        default: ''
      # Per-instance variables. The shared env: block below can only express
      # one repo-wide value per name; this is how one instance overrides one.
      # -var-file outranks env-set TF_VAR_*, so an entry here beats the env
      # block for the same variable.
      var_file:
        description: 'Optional -var-file=... for the plan, resolved relative to working_directory.'
        required: false
        type: string
        default: ''
      apply:
        description: 'Apply the plan after it succeeds'
        required: false
        type: boolean
        default: false
      ssh_source_ip:
        description: 'Optional -var=ssh_source_ip=... for the plan (network module only)'
        required: false
        type: string
        default: ''
      # Used only by destroy.yml (#153), which is how that workflow stopped
      # hand-rolling its own jobs. It flips the plan to `-destroy`; the apply
      # gate below is deliberately shared rather than duplicated, so
      # `destroy: true` on its own still only ever produces a dry run.
      destroy:
        description: 'Plan a destroy instead of a create/update'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  # Load-bearing for every caller as of E02.3 (#35): Azure auth is OIDC-only,
  # so a job that cannot mint an OIDC token cannot authenticate at all.
  id-token: write

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    concurrency:
      # One group per *state blob*, which is the thing actually being
      # protected: every run that plans or applies takes a lease on it. The
      # key therefore derives from whatever determines the state key —
      # state_key when set, the module path when it is not (#163). A module
      # that passes no state_key gets exactly the group it had before.
      #
      # Any future workflow that also runs Terraform against an instance must
      # join this same group rather than defining its own. When oidc-smoke.yml
      # existed, a separate tf-<dir>-oidc-smoke group was tried and reverted —
      # the two sets of jobs then ran simultaneously and four plans died on
      # "state blob is already locked". Serializing is the correct trade: a
      # queued run that gets cancelled breaks nothing, while a lock collision
      # fails real work and could strand an apply mid-flight.
      group: tf-${{ inputs.state_key || inputs.working_directory }}
      cancel-in-progress: false
    env:
      # Shared by compute/vm (self-registered DNS A-record) and infra/dns, which
      # declare these variables with the same names and the same meaning. Safe as
      # static env for exactly that reason — no other module declares either name,
      # so nothing else can be overridden by accident. Do not remove.
      #
      # infra/dns reached TF_VAR_dns_rg_name by renaming its `rg_name` variable;
      # under the old name it collided with infra/network/storage/compute and
      # needed an if:-gated step here instead. See infra/dns/variables.tf.
      TF_VAR_dns_zone_name: ${{ secrets.DNS_ZONE_NAME }}
      TF_VAR_dns_rg_name: ${{ secrets.RESOURCE_GROUP_NAME }}
      # infra/cloudflare-only variable names; safe as static env since they
      # don't collide with any variable declared by another module.
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_azure_dns_zone_name: ${{ secrets.DNS_ZONE_NAME }}
      TF_VAR_azure_rg_name: ${{ secrets.RESOURCE_GROUP_NAME }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # E02.3 (#35): one keyless path for every module. This replaced a
      # three-way fork — ARM_* secrets for network/storage/compute, AZURE_*
      # secrets for dns/cloudflare, and this step behind a use_oidc flag —
      # with a single identity, so there is no longer any per-module
      # credential branching to keep straight.
      #
      # ARM_CLIENT_ID/TENANT_ID/SUBSCRIPTION_ID come from repo *variables*,
      # not secrets: they are identifiers, not credentials
      # (infra/identity/outputs.tf says the same thing at the source).
      #
      # Still written via $GITHUB_ENV rather than a static env: entry. The
      # fork it used to disambiguate is gone, but the property is worth
      # keeping — a static entry silently wins over a later $GITHUB_ENV
      # write, so anything added here later would fail confusingly.
      #
      # ARM_USE_AZUREAD is load-bearing, not cosmetic: without it the azurerm
      # backend authenticates to blob storage by calling listKeys on the state
      # storage account, and the UAMI deliberately holds no rights over that
      # account — only Storage Blob Data Contributor on the tfstate container.
      # Omit it and `terraform init` fails before validate ever runs.
      - name: Use OIDC federated credentials
        run: |
          echo "ARM_USE_OIDC=true" >> "$GITHUB_ENV"
          echo "ARM_USE_AZUREAD=true" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_ID=${{ vars.ARM_CLIENT_ID }}" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=${{ vars.ARM_SUBSCRIPTION_ID }}" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=${{ vars.ARM_TENANT_ID }}" >> "$GITHUB_ENV"

      - name: Read pinned Terraform version
        id: tfversion
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfversion.outputs.version }}

      - name: Terraform Version
        working-directory: ${{ inputs.working_directory }}
        run: terraform version

      # Same argument-array idiom as the plan step below, for the same reason:
      # the backend key composes in without a second code path. -input=false is
      # load-bearing under partial backend config — a missing key would
      # otherwise leave Terraform waiting on a prompt no runner can answer.
      #
      # No -reconfigure: runners are clean per job, so there is never a stale
      # .terraform/ to correct. A *local* operator switching instances inside
      # one checkout does need it — see CLAUDE.md.
      - name: Terraform Init
        working-directory: ${{ inputs.working_directory }}
        run: |
          args=(-input=false)
          if [ -n "${{ inputs.state_key }}" ]; then
            args+=(-backend-config="key=${{ inputs.state_key }}")
          fi
          terraform init "${args[@]}"

      - name: Terraform Validate
        working-directory: ${{ inputs.working_directory }}
        run: terraform validate

      # Built as an argument array so `-destroy`, `-var=ssh_source_ip` and
      # `-var-file` compose independently instead of needing one branch per
      # combination. Keep that property when adding flags.
      # The step name carries the mode because this is the only place a
      # destroy plan is distinguishable at a glance in the run log.
      - name: Terraform Plan${{ inputs.destroy && ' (Destroy)' || '' }}
        id: plan
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -o pipefail
          args=(-no-color -out=tfplan)
          if [ "${{ inputs.destroy }}" = "true" ]; then
            args+=(-destroy)
          fi
          if [ -n "${{ inputs.ssh_source_ip }}" ]; then
            args+=(-var="ssh_source_ip=${{ inputs.ssh_source_ip }}")
          fi
          if [ -n "${{ inputs.var_file }}" ]; then
            args+=(-var-file="${{ inputs.var_file }}")
          fi
          terraform plan "${args[@]}" 2>&1 | tee plan_output.txt

      # One sticky comment per *instance*, keyed by the `tf-plan: <instance>`
      # marker — where the instance is the state key when there is one and the
      # module path otherwise, the same rule the concurrency group uses (#163).
      # Keyed by directory alone, two legs of one module found each other's
      # comment via includes(marker) and raced to overwrite it, leaving one
      # arbitrary plan visible. Two legs now create two comments instead.
      # There was a suppression input here while oidc-smoke.yml existed, so its
      # plans of the same five modules could not clobber these comments; with
      # that workflow deleted, every run reaching this step is the one run that
      # should own its module's comment. Reintroduce the opt-out if a second
      # workflow ever plans the same directory.
      - name: Comment plan on PR
        if: "!cancelled() && steps.plan.outcome != 'skipped' && github.event_name == 'pull_request'"
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const workingDir = '${{ inputs.working_directory }}';
            const stateKey = '${{ inputs.state_key }}';
            const instance = stateKey || workingDir;
            const marker = `<!-- tf-plan: ${instance} -->`;
            const heading = stateKey ? `\`${workingDir}\` — \`${stateKey}\`` : `\`${workingDir}\``;
            const planFailed = '${{ steps.plan.outcome }}' !== 'success';

            let planText = fs.readFileSync(path.join(workingDir, 'plan_output.txt'), 'utf8');
            const maxLen = 60000;
            let truncated = false;
            if (planText.length > maxLen) {
              planText = planText.slice(0, maxLen);
              truncated = true;
            }

            // infra/network's SSH NSG rule is whitelisted to whatever IP ran
            // `plan` (fetched live from api.ipify.org), so local and CI plans
            // always disagree here until #54 (E06.4) removes the ipify data
            // source. Flag it so reviewers don't read it as real drift.
            const noise = workingDir === 'infra/network'
              ? '\n> **Known noise:** the NSG SSH rule diff reflects the ' +
                'plan runner\'s public IP (fetched live from api.ipify.org). ' +
                'Local and CI plans always disagree here until #54 (E06.4) ' +
                'lands — this is not real drift.\n'
              : '';

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              `#### Terraform Plan — ${heading}` + (planFailed ? ' — plan failed' : ''),
              marker,
              noise,
              planFailed ? '\n**Plan failed** — see the output below.\n' : '',
              '<details><summary>Show plan</summary>',
              '',
              '```diff',
              planText + (truncated ? '\n... (truncated)' : ''),
              '```',
              '</details>',
              '',
              `*Workflow run: [${context.workflow} #${context.runNumber}](${runUrl})*`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      # Applies whatever plan was saved above, which since #153 may be a
      # destroy plan (destroy.yml passes `destroy: true` and maps its
      # `apply_destroy` checkbox onto `apply`). One gate covers both
      # directions on purpose: a second, destroy-specific gate would be a
      # second thing to get wrong on the one path that deletes real infra.
      - name: Terraform Apply
        if: inputs.apply == true && github.event_name != 'pull_request'
        working-directory: ${{ inputs.working_directory }}
        run: terraform apply -auto-approve tfplan
