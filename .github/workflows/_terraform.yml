name: Terraform (reusable)

on:
  workflow_call:
    inputs:
      working_directory:
        description: 'Path to the Terraform root module (e.g. infra/network)'
        required: true
        type: string
      apply:
        description: 'Apply the plan after it succeeds'
        required: false
        type: boolean
        default: false
      ssh_source_ip:
        description: 'Optional -var=ssh_source_ip=... for the plan (network module only)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: write
  # Load-bearing for every caller as of E02.3 (#35): Azure auth is OIDC-only,
  # so a job that cannot mint an OIDC token cannot authenticate at all.
  id-token: write

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    concurrency:
      # One group per module: the thing being protected is the module's state
      # blob, and every run that plans or applies takes a lease on it.
      #
      # Any future workflow that also runs Terraform against a module must join
      # this same group rather than defining its own. When oidc-smoke.yml
      # existed, a separate tf-<dir>-oidc-smoke group was tried and reverted —
      # the two sets of jobs then ran simultaneously and four plans died on
      # "state blob is already locked". Serializing is the correct trade: a
      # queued run that gets cancelled breaks nothing, while a lock collision
      # fails real work and could strand an apply mid-flight.
      group: tf-${{ inputs.working_directory }}
      cancel-in-progress: false
    env:
      # Shared by compute/vm (self-registered DNS A-record) and infra/dns, which
      # declare these variables with the same names and the same meaning. Safe as
      # static env for exactly that reason — no other module declares either name,
      # so nothing else can be overridden by accident. Do not remove.
      #
      # infra/dns reached TF_VAR_dns_rg_name by renaming its `rg_name` variable;
      # under the old name it collided with infra/network/storage/compute and
      # needed an if:-gated step here instead. See infra/dns/variables.tf.
      TF_VAR_dns_zone_name: ${{ secrets.DNS_ZONE_NAME }}
      TF_VAR_dns_rg_name: ${{ secrets.RESOURCE_GROUP_NAME }}
      # infra/cloudflare-only variable names; safe as static env since they
      # don't collide with any variable declared by another module.
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_azure_dns_zone_name: ${{ secrets.DNS_ZONE_NAME }}
      TF_VAR_azure_rg_name: ${{ secrets.RESOURCE_GROUP_NAME }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # E02.3 (#35): one keyless path for every module. This replaced a
      # three-way fork — ARM_* secrets for network/storage/compute, AZURE_*
      # secrets for dns/cloudflare, and this step behind a use_oidc flag —
      # with a single identity, so there is no longer any per-module
      # credential branching to keep straight.
      #
      # ARM_CLIENT_ID/TENANT_ID/SUBSCRIPTION_ID come from repo *variables*,
      # not secrets: they are identifiers, not credentials
      # (infra/identity/outputs.tf says the same thing at the source).
      #
      # Still written via $GITHUB_ENV rather than a static env: entry. The
      # fork it used to disambiguate is gone, but the property is worth
      # keeping — a static entry silently wins over a later $GITHUB_ENV
      # write, so anything added here later would fail confusingly.
      #
      # ARM_USE_AZUREAD is load-bearing, not cosmetic: without it the azurerm
      # backend authenticates to blob storage by calling listKeys on the state
      # storage account, and the UAMI deliberately holds no rights over that
      # account — only Storage Blob Data Contributor on the tfstate container.
      # Omit it and `terraform init` fails before validate ever runs.
      - name: Use OIDC federated credentials
        run: |
          echo "ARM_USE_OIDC=true" >> "$GITHUB_ENV"
          echo "ARM_USE_AZUREAD=true" >> "$GITHUB_ENV"
          echo "ARM_CLIENT_ID=${{ vars.ARM_CLIENT_ID }}" >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=${{ vars.ARM_SUBSCRIPTION_ID }}" >> "$GITHUB_ENV"
          echo "ARM_TENANT_ID=${{ vars.ARM_TENANT_ID }}" >> "$GITHUB_ENV"

      - name: Read pinned Terraform version
        id: tfversion
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfversion.outputs.version }}

      - name: Terraform Version
        working-directory: ${{ inputs.working_directory }}
        run: terraform version

      - name: Terraform Init
        working-directory: ${{ inputs.working_directory }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ inputs.working_directory }}
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ${{ inputs.working_directory }}
        run: |
          set -o pipefail
          if [ -n "${{ inputs.ssh_source_ip }}" ]; then
            terraform plan -no-color -var="ssh_source_ip=${{ inputs.ssh_source_ip }}" -out=tfplan 2>&1 | tee plan_output.txt
          else
            terraform plan -no-color -out=tfplan 2>&1 | tee plan_output.txt
          fi

      # One sticky comment per module, keyed by the `tf-plan: <dir>` marker.
      # There was a suppression input here while oidc-smoke.yml existed, so its
      # plans of the same five modules could not clobber these comments; with
      # that workflow deleted, every run reaching this step is the one run that
      # should own its module's comment. Reintroduce the opt-out if a second
      # workflow ever plans the same directory.
      - name: Comment plan on PR
        if: "!cancelled() && steps.plan.outcome != 'skipped' && github.event_name == 'pull_request'"
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const workingDir = '${{ inputs.working_directory }}';
            const marker = `<!-- tf-plan: ${workingDir} -->`;
            const planFailed = '${{ steps.plan.outcome }}' !== 'success';

            let planText = fs.readFileSync(path.join(workingDir, 'plan_output.txt'), 'utf8');
            const maxLen = 60000;
            let truncated = false;
            if (planText.length > maxLen) {
              planText = planText.slice(0, maxLen);
              truncated = true;
            }

            // infra/network's SSH NSG rule is whitelisted to whatever IP ran
            // `plan` (fetched live from api.ipify.org), so local and CI plans
            // always disagree here until #54 (E06.4) removes the ipify data
            // source. Flag it so reviewers don't read it as real drift.
            const noise = workingDir === 'infra/network'
              ? '\n> **Known noise:** the NSG SSH rule diff reflects the ' +
                'plan runner\'s public IP (fetched live from api.ipify.org). ' +
                'Local and CI plans always disagree here until #54 (E06.4) ' +
                'lands — this is not real drift.\n'
              : '';

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              `#### Terraform Plan — \`${workingDir}\`` + (planFailed ? ' — plan failed' : ''),
              marker,
              noise,
              planFailed ? '\n**Plan failed** — see the output below.\n' : '',
              '<details><summary>Show plan</summary>',
              '',
              '```diff',
              planText + (truncated ? '\n... (truncated)' : ''),
              '```',
              '</details>',
              '',
              `*Workflow run: [${context.workflow} #${context.runNumber}](${runUrl})*`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: Terraform Apply
        if: inputs.apply == true && github.event_name != 'pull_request'
        working-directory: ${{ inputs.working_directory }}
        run: terraform apply -auto-approve tfplan
