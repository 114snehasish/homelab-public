name: Deploy Cloudflare

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Applying the changes'
        type: boolean
        default: false
  workflow_call:
    inputs:
      apply:
        required: false
        type: boolean
        default: false
  # Pinned to main: a push run's OIDC subject is
  # `repo:114snehasish/homelab:ref:refs/heads/<branch>`, and the only federated
  # credentials are for `:ref:refs/heads/main` and `:pull_request` (E02.3, #35).
  # A feature-branch push could only ever fail at Azure auth; the `pull_request`
  # trigger below is what gives a branch its plan.
  #
  # _terraform.yml is in the filters (#153) because a change to the shared
  # workflow otherwise matched nothing and ran no Terraform at all — one of the
  # two coverage gaps left when oidc-smoke.yml was deleted in #35. A PR editing
  # it now gets a real plan from all five modules.
  push:
    branches: [main]
    paths:
      - 'infra/cloudflare/**'
      - '.github/workflows/deploy-cloudflare.yml'
      - '.github/workflows/_terraform.yml'
  pull_request:
    paths:
      - 'infra/cloudflare/**'
      - '.github/workflows/deploy-cloudflare.yml'
      - '.github/workflows/_terraform.yml'

permissions:
  contents: read
  pull-requests: write
  # _terraform.yml declares id-token: write for its OIDC path; a caller
  # granting less than the workflow it calls fails the run at startup.
  id-token: write

jobs:
  terraform:
    name: Terraform Cloudflare
    uses: ./.github/workflows/_terraform.yml
    secrets: inherit
    with:
      working_directory: infra/cloudflare
      apply: ${{ inputs.apply == true }}
