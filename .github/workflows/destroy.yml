name: Destroy Homelab Infrastructure

# Tears down billable compute in reverse dependency order:
# compute/vm -> infra/cloudflare.
# infra/storage is never touched (persistent data disk, prevent_destroy).
# infra/network is never touched: the disk lives inside homelab-rg, so the
# RG cannot be destroyed while the disk exists; VNet/subnet/NSG cost nothing.
# infra/dns is never touched either: the zone is a flat ~$0.52/month
# regardless of usage, not worth tearing down every cycle, and destroying it
# breaks infra/cloudflare's and compute/vm's data-source lookups by name
# between deploy cycles (#124).
#
# Both jobs are thin callers of _terraform.yml, same as the deploy-*.yml
# workflows (#153) — they inherit the .terraform-version pin, `validate`, the
# OIDC auth step and the per-module `tf-<dir>` concurrency group from there.
# The only difference from a deploy caller is `destroy: true`, which flips the
# plan to `-destroy`; the apply gate is the same one.
#
# workflow_dispatch runs inherit the ref they were dispatched from, and the
# only federated credentials are `:ref:refs/heads/main` and `:pull_request`
# (E02.3, #35) — so dispatch this from main. From a branch it fails at Azure
# auth, by design.

on:
  workflow_dispatch:
    inputs:
      apply_destroy:
        description: 'IMPORTANT: Whether to actually destroy the resources. Uncheck for a dry run (plan -destroy only).'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  # _terraform.yml declares id-token: write for its OIDC path; a caller
  # granting less than the workflow it calls fails the run at startup.
  id-token: write

concurrency:
  # Workflow-level, so a destroy and a deploy can never interleave. Each called
  # job additionally takes _terraform.yml's `tf-<working_directory>` group,
  # which is what actually leases the module's state blob.
  group: homelab-terraform

jobs:
  destroy-compute:
    name: Destroy Compute
    uses: ./.github/workflows/_terraform.yml
    secrets: inherit
    with:
      working_directory: compute/vm
      destroy: true
      apply: ${{ inputs.apply_destroy == true }}

  destroy-cloudflare:
    name: Destroy Cloudflare
    needs: destroy-compute
    uses: ./.github/workflows/_terraform.yml
    secrets: inherit
    with:
      working_directory: infra/cloudflare
      destroy: true
      apply: ${{ inputs.apply_destroy == true }}
