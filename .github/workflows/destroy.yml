name: Destroy Homelab Infrastructure

# Tears down billable compute in reverse dependency order:
# compute/vm -> infra/cloudflare.
# infra/storage is never touched (persistent data disk, prevent_destroy).
# infra/network is never touched: the disk lives inside homelab-rg, so the
# RG cannot be destroyed while the disk exists; VNet/subnet/NSG cost nothing.
# infra/dns is never touched either: the zone is a flat ~$0.52/month
# regardless of usage, not worth tearing down every cycle, and destroying it
# breaks infra/cloudflare's and compute/vm's data-source lookups by name
# between deploy cycles (#124).
#
# Unlike every other Terraform workflow here, this one hand-rolls its jobs
# instead of calling _terraform.yml, so it duplicates auth and pins no Terraform
# version. #153 tracks migrating it; until then, changes to the shared path have
# to be mirrored here by hand.

on:
  workflow_dispatch:
    inputs:
      apply_destroy:
        description: 'IMPORTANT: Whether to actually destroy the resources. Uncheck for a dry run (plan -destroy only).'
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read
  # The deploy-*.yml workflows this calls declare pull-requests: write
  # (plan comments); a caller must cover everything its callee declares.
  pull-requests: write

concurrency:
  group: homelab-terraform

jobs:
  destroy-compute:
    name: Destroy Compute
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compute/vm
    env:
      # Keyless, same UAMI the deploy path uses (E02.3, #35). Static env: is
      # safe here in a way it is not in _terraform.yml — this job has no second
      # credential source for a later $GITHUB_ENV write to lose to.
      #
      # This workflow is workflow_dispatch-only and dispatched from main, so the
      # `:ref:refs/heads/main` federated credential matches. Dispatching it from
      # a branch fails at auth, by design.
      #
      # ARM_USE_AZUREAD is required for the backend: the UAMI holds no rights on
      # the state storage *account*, only Storage Blob Data Contributor on the
      # tfstate container, so listKeys auth would fail `terraform init`.
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
      TF_VAR_dns_zone_name: ${{ secrets.DNS_ZONE_NAME }}
      TF_VAR_dns_rg_name: ${{ secrets.RESOURCE_GROUP_NAME }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan (Destroy)
        run: terraform plan -destroy -out=tfplan

      - name: Terraform Apply (Destroy)
        if: inputs.apply_destroy == true
        run: terraform apply -auto-approve tfplan

  destroy-cloudflare:
    name: Destroy Cloudflare
    needs: destroy-compute
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare
    env:
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      TF_VAR_azure_dns_zone_name: ${{ secrets.DNS_ZONE_NAME }}
      TF_VAR_azure_rg_name: ${{ secrets.RESOURCE_GROUP_NAME }}
      # Azure credentials needed for the DNS zone data-source lookup. Identical
      # to destroy-compute's block above: E02.3 (#35) collapsed the ARM_*
      # (compute) / AZURE_* (cloudflare) secret split into one identity.
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan (Destroy)
        run: terraform plan -destroy -out=tfplan

      - name: Terraform Apply (Destroy)
        if: inputs.apply_destroy == true
        run: terraform apply -auto-approve tfplan
