name: Destroy Homelab Infrastructure

# Destroy = PARK, then remove the Cloudflare NS delegation for the Azure zone
# (#101). The park half is _park.yml — the same implementation park.yml runs —
# so this workflow can never destroy compute without a verified final backup,
# and it deliberately exposes no skip_backup: the bypass exists in park.yml only.
# For a wedged node, run park.yml with skip_backup first; this workflow's park
# leg then finds no VMs, does nothing, and the cloudflare leg proceeds.
#
# Before #101 this file destroyed compute/vm directly with no backup — a second,
# divergent destroy path (the #118 comment, review finding 3). Now there is one.
#
# Order matters: the cloudflare leg `needs: park`, so the delegation is removed
# only after the backup is verified and compute is gone. Removing the delegation
# while the Azure zone survives is safe; the dangerous order — zone gone,
# delegation still pointing at it — is a subdomain-takeover risk, and nothing in
# CI deletes the zone.
#
# Still never touched, unchanged reasons:
# - infra/storage: the pet disks (prevent_destroy; CI cannot delete disks at all).
# - infra/network: VNet/subnet/NSG/RG cost nothing to leave up, and the DNS zone
#   in homelab-rg is read by name via data sources with no tolerance for
#   absence (#124). ADR-0009 §5 records the reason changing at E15.2 (#98).
# - infra/dns: the zone is a flat ~$0.52/month, and destroying it breaks those
#   same lookups between cycles (#124).
# - infra/identity and infra/backup: local Owner applies with no workflow.
#
# To come back from a destroy, run deploy.yml: it re-applies infra/cloudflare and
# its compute leg is _resume.yml, so it ends with the same health check.
#
# apply_destroy unchecked = dry run: _park.yml only reads and plans, and the
# cloudflare leg plans -destroy. Dispatch from main (OIDC subject).

on:
  workflow_dispatch:
    inputs:
      apply_destroy:
        description: 'IMPORTANT: Whether to actually park and destroy. Uncheck for a dry run (plan -destroy only).'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  # _park.yml and _terraform.yml declare id-token: write; a caller granting less
  # than the workflow it calls fails the run at startup.
  id-token: write

concurrency:
  # Shared with park.yml, resume.yml and deploy.yml. _park.yml declares no group
  # of its own (it would collide with this one); its Terraform job still takes
  # _terraform.yml's per-state-blob tf- group.
  group: homelab-terraform
  queue: max

jobs:
  park:
    name: Park
    uses: ./.github/workflows/_park.yml
    secrets: inherit
    with:
      apply: ${{ inputs.apply_destroy == true }}

  destroy-cloudflare:
    name: Destroy Cloudflare
    needs: park
    uses: ./.github/workflows/_terraform.yml
    secrets: inherit
    with:
      working_directory: infra/cloudflare
      destroy: true
      apply: ${{ inputs.apply_destroy == true }}
