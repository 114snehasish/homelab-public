name: Apps image

# Publishes every app that has a Dockerfile to GHCR (E03.4 PR B, #40), so a node
# pulls its image in seconds instead of compiling it. For Caddy that compile was
# ~4 min and left 2.36 GB of build cache on the node every time.
#
# The image reference in apps/<app>/docker-compose.yml is the single source of
# truth: this workflow publishes exactly that reference, and the node pulls
# exactly that reference. Tags are immutable. scripts/ci/app-image-state.sh
# compares each published image's Dockerfile-hash label with the checkout:
#
#   absent   never published        -> `publish` builds and pushes it (main only)
#   current  built from this file   -> nothing to do
#   stale    built from another one -> both jobs fail: bump the tag in compose
#
# So a Dockerfile change, including a Dependabot FROM bump, fails its PR until
# the compose tag is bumped too. That is the point: with auto-deploy (PR C) a
# merged tag bump is a rollout, and it should be a visible one.
#
# Why GHCR and why public (#40, first comment): ACR Basic alone would cost more
# per month than the whole parked lab; a public package is free and pulls
# anonymously, so the edge VM never holds a registry credential. The first push
# creates the package PRIVATE, because the repo is private. Make it public once,
# by hand, in the package's settings. Until then the node cannot pull it.
#
# Permissions: `check` runs everywhere with packages: read. Only `publish` holds
# packages: write, and it never runs on a pull_request, so PR code cannot push.

on:
  push:
    branches: [main]
    paths:
      - 'apps/*/Dockerfile'
      - 'apps/*/docker-compose.yml'
      - 'scripts/ci/app-image-state.sh'
      - '.github/workflows/apps-image.yml'
  pull_request:
    paths:
      - 'apps/*/Dockerfile'
      - 'apps/*/docker-compose.yml'
      - 'scripts/ci/app-image-state.sh'
      - '.github/workflows/apps-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-image-${{ github.ref }}
  # Superseded PR runs can go; a publish on main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  discover:
    name: Discover images
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      # Unlike apps-check.yml, none is fine: most apps pull a third-party image.
      - name: List apps/*/Dockerfile
        id: list
        run: |
          set -euo pipefail
          apps="$(
            for f in apps/*/Dockerfile; do
              if [ -f "$f" ]; then basename "$(dirname "$f")"; fi
            done | jq -Rnc '[inputs]'
          )"
          echo "apps=$apps" >>"$GITHUB_OUTPUT"
          echo "Apps with a Dockerfile: $apps"

  check:
    name: Check (${{ matrix.app }})
    needs: discover
    if: needs.discover.outputs.apps != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Env template
        run: |
          d="apps/$APP"
          if [ -f "$d/.env.example" ] && [ ! -f "$d/.env" ]; then cp "$d/.env.example" "$d/.env"; fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Published image state
        id: state
        run: scripts/ci/app-image-state.sh "apps/$APP"

      - name: Summary
        if: ${{ !cancelled() && steps.state.outputs.state != '' }}
        env:
          REF: ${{ steps.state.outputs.ref }}
          STATE: ${{ steps.state.outputs.state }}
        run: |
          case "$STATE" in
            current) msg="already published from this Dockerfile; nothing to publish" ;;
            absent)  msg="not published yet; the push to \`main\` publishes it" ;;
            *)       msg="**stale**: published from a different Dockerfile, bump the tag" ;;
          esac
          echo "- \`$REF\`: $msg" >>"$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish (${{ matrix.app }})
    needs: [discover, check]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Env template
        run: |
          d="apps/$APP"
          if [ -f "$d/.env.example" ] && [ ! -f "$d/.env" ]; then cp "$d/.env.example" "$d/.env"; fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-read here rather than passing it from `check`: a matrix job exposes
      # only one leg's outputs, and this costs one registry round trip.
      - name: Published image state
        id: state
        run: scripts/ci/app-image-state.sh "apps/$APP"

      - name: Set up Buildx
        if: steps.state.outputs.state == 'absent'
        uses: docker/setup-buildx-action@v4

      # Same cache scope as apps-check.yml's leg, so a tag bump that only
      # follows an already-built Dockerfile does not recompile.
      #
      # Labels: the Dockerfile hash is what app-image-state.sh compares. The
      # source label is set explicitly because the Caddy base image carries
      # caddyserver/caddy-docker's, and GHCR links a package to whatever repo
      # that label names. One platform and no attestations, so the tag is a
      # single manifest the node resolves directly.
      - name: Build and push
        if: steps.state.outputs.state == 'absent'
        uses: docker/build-push-action@v7
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.state.outputs.ref }}
          labels: |
            homelab.dockerfile-sha256=${{ steps.state.outputs.dockerfile_sha256 }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.state.outputs.tag }}
          cache-from: type=gha,scope=app-${{ matrix.app }}
          cache-to: type=gha,scope=app-${{ matrix.app }},mode=max

      - name: Verify
        id: verify
        if: steps.state.outputs.state == 'absent'
        run: |
          set -euo pipefail
          scripts/ci/app-image-state.sh "apps/$APP" | tee "$RUNNER_TEMP/after"
          grep -qx 'state=current' "$RUNNER_TEMP/after"

      - name: Summary
        if: ${{ !cancelled() && steps.state.outputs.state != '' }}
        env:
          REF: ${{ steps.state.outputs.ref }}
          BEFORE: ${{ steps.state.outputs.state }}
          VERIFIED: ${{ steps.verify.outcome }}
        run: |
          {
            if [ "$BEFORE" = current ]; then
              echo "- \`$REF\`: already published, nothing pushed"
            elif [ "$VERIFIED" = success ]; then
              echo "- \`$REF\`: **published** and verified"
              echo "- If this is the package's first push it is **private**: make it public in the package settings, or the node cannot pull it."
            else
              echo "- \`$REF\`: publish **failed**"
            fi
          } >>"$GITHUB_STEP_SUMMARY"
