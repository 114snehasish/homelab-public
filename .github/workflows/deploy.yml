name: Deploy Homelab Infrastructure

on:
  workflow_dispatch:
    inputs:
      ssh_source_ip:
        description: 'The IP address to whitelist for SSH access (e.g., 1.2.3.4/32). Leave empty to use the runner IP (not recommended as it changes).'
        required: false
        type: string
      apply_terraform:
        description: 'Whether to apply the changes. Uncheck for a dry run (plan only).'
        required: true
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read
  # The deploy-*.yml workflows this calls declare pull-requests: write
  # (plan comments); a caller must cover everything its callee declares.
  pull-requests: write

concurrency:
  # Shared with park.yml, resume.yml and destroy.yml (#101), so no two lifecycle
  # runs interleave. queue: max because the default keeps one pending run and
  # silently cancels it when another is dispatched. The called workflows declare
  # no top-level group of their own — one would collide with this one.
  group: homelab-terraform
  queue: max

jobs:
  network:
    name: Network
    uses: ./.github/workflows/deploy-network.yml
    secrets: inherit
    with:
      ssh_source_ip: ${{ inputs.ssh_source_ip }}
      apply: ${{ inputs.apply_terraform }}

  dns:
    name: DNS
    needs: network
    uses: ./.github/workflows/deploy-dns.yml
    secrets: inherit
    with:
      apply: ${{ inputs.apply_terraform }}

  cloudflare:
    name: Cloudflare
    needs: dns
    uses: ./.github/workflows/deploy-cloudflare.yml
    secrets: inherit
    with:
      apply: ${{ inputs.apply_terraform }}

  storage:
    name: Storage
    needs: cloudflare
    uses: ./.github/workflows/deploy-storage.yml
    secrets: inherit
    with:
      apply: ${{ inputs.apply_terraform }}

  # _resume.yml, not deploy-compute.yml directly (#101): it applies compute
  # through deploy-compute.yml and then runs the resume health check, so a full
  # deploy — including the one that follows a destroy.yml — is not done until
  # the nodes, their containers and the edge are verified. destroy.yml mirrors
  # this on the way down by calling _park.yml.
  compute:
    name: Compute
    needs: storage
    uses: ./.github/workflows/_resume.yml
    secrets: inherit
    with:
      apply: ${{ inputs.apply_terraform }}
