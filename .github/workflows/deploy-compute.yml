name: Deploy Compute

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Applying the changes'
        type: boolean
        default: false
  workflow_call:
    inputs:
      apply:
        required: false
        type: boolean
        default: false
  # Pinned to main: a push run's OIDC subject is
  # `repo:114snehasish/homelab:ref:refs/heads/<branch>`, and the only federated
  # credentials are for `:ref:refs/heads/main` and `:pull_request` (E02.3, #35).
  # A feature-branch push could only ever fail at Azure auth; the `pull_request`
  # trigger below is what gives a branch its plan.
  #
  # _terraform.yml is in the filters (#153) because a change to the shared
  # workflow otherwise matched nothing and ran no Terraform at all — one of the
  # two coverage gaps left when oidc-smoke.yml was deleted in #35. A PR editing
  # it now gets a real plan from all five modules.
  #
  # `compute/vm/**` fires *every* matrix leg on any change under the module —
  # correct for shared code, noisy for an edit to a single instance's tfvars.
  # That noise is the accepted trade: the alternative is a workflow file per
  # instance, which is exactly the duplication #153 removed.
  push:
    branches: [main]
    paths:
      - 'compute/vm/**'
      - '.github/workflows/deploy-compute.yml'
      - '.github/workflows/_terraform.yml'
  pull_request:
    paths:
      - 'compute/vm/**'
      - '.github/workflows/deploy-compute.yml'
      - '.github/workflows/_terraform.yml'

permissions:
  contents: read
  pull-requests: write
  # _terraform.yml declares id-token: write for its OIDC path; a caller
  # granting less than the workflow it calls fails the run at startup.
  id-token: write

jobs:
  terraform:
    # One leg per compute instance (E17.4, #163). Today the fleet is one node
    # and that is deliberate — multiplicity is a capability, not a deployment
    # (#159, ADR-0012). A second entry is what #166 adds once a workload has
    # passed the "earns its own VM" test.
    #
    # state_key and var_file are spelled out per entry rather than derived from
    # `name`: the existing node's key is `homelab.compute.tfstate`, which no
    # naming convention reproduces without a special case. state_key is also
    # the leg's concurrency group and PR-comment identity in _terraform.yml,
    # so two entries must never share one.
    #
    # var_file is resolved relative to compute/vm and belongs in
    # compute/vm/instances/ (see the README there). The existing node has none:
    # its values are the module defaults plus the shared TF_VAR_* env block.
    name: Terraform Compute (${{ matrix.instance.name }})
    strategy:
      # A failed plan on one instance must not cancel the others' plans.
      fail-fast: false
      matrix:
        instance:
          - name: homelab-vm
            state_key: homelab.compute.tfstate
            var_file: ''
          # TEMPORARY — verification leg for #163, deleted before merge.
          # Proves two instances plan concurrently: distinct state blob,
          # distinct concurrency group, distinct sticky comment, and a
          # -var-file that renames every resource in its plan.
          - name: canary
            state_key: homelab.compute.canary.tfstate
            var_file: instances/canary.tfvars
    uses: ./.github/workflows/_terraform.yml
    secrets: inherit
    with:
      working_directory: compute/vm
      state_key: ${{ matrix.instance.state_key }}
      var_file: ${{ matrix.instance.var_file }}
      apply: ${{ inputs.apply == true }}
