version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/infra/identity"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/infra/network"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/infra/dns"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/infra/cloudflare"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/infra/storage"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directory: "/compute/vm"
    schedule:
      interval: "weekly"

  # Tracks the two FROM lines in apps/caddy/Dockerfile (#40). It cannot see the
  # caddy-dns/azure version: that is an argument to `RUN xcaddy build`, which
  # Dependabot does not parse, so the plugin stays a manual bump. Its PRs need
  # no secrets, so apps-check.yml gives them a real build + validate.
  # Every such PR stays red until a human also bumps the image tag in
  # apps/caddy/docker-compose.yml (tags are immutable, apps-image.yml), and
  # until both FROM lines agree (apps/caddy/check.sh). Merging it is a rollout.
  - package-ecosystem: "docker"
    directory: "/apps/caddy"
    schedule:
      interval: "weekly"
