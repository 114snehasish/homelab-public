#cloud-config
#
# Base cloud-config for compute/vm nodes. Terraform does not send this file
# as-is: compute/vm/cloud-init.tf parses it, appends the mount contract's files
# (#99) to write_files, and re-encodes the result into custom_data. Nothing here
# is a Terraform template, so shell ${...} needs no escaping.
#
# The data disk is not handled here. systemd units from compute/vm/persist/
# prepare, mount and verify it on every boot, and hold Docker down until that
# succeeds — see docs/runbooks/data_guard.md.

package_upgrade: true
packages:
  - ca-certificates
  - curl
  - gnupg

runcmd:
  # 1. The persistence chain. Its units arrived through write_files; start it
  #    without blocking cloud-init. On a resume the disk attachment can land
  #    after this runs, and homelab-persist-prepare waits for it.
  - systemctl daemon-reload
  - systemctl enable homelab-persist.target
  - systemctl start --no-block homelab-persist.target

  # 2. Docker's apt repository.
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update

  # 3. Install Docker without letting the packages start it. docker-ce and
  #    containerd.io start their daemons from postinst; a policy-rc.d that exits
  #    101 vetoes that, so each daemon only ever starts through its drop-in,
  #    behind homelab-persist.target. /etc/docker/daemon.json is already in place
  #    from write_files, so dockerd never initialises /var/lib/docker either.
  #    No `exit` in this block: every runcmd entry shares one shell script.
  - |
    printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
    chmod 0755 /usr/sbin/policy-rc.d
    DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
    rm -f /usr/sbin/policy-rc.d
  - usermod -aG docker azureuser

  # 4. Start Docker through the guard. The job waits for homelab-persist.target,
  #    then starts or fails with "Dependency failed" and the chain's reason in
  #    journald. Last on purpose: if the install failed there is no
  #    docker.service, this exits non-zero, and cloud-init status reports it.
  - systemctl start --no-block docker.service
