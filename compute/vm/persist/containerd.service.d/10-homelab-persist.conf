# containerd starts only once every data disk is mounted and has passed its
# data-guard, and keeps its root on the data disk (#99).
#
# Docker Engine 29+ uses the containerd image store on fresh installs: image
# content and container snapshots live under containerd's root, which Docker's
# data-root does not move. Leaving it at /var/lib/containerd would persist the
# containers in /data/docker without the snapshots they point at, and none of
# them would restart after a VM recreate.
#
# --root on the command line rather than `root =` in /etc/containerd/config.toml:
# that file belongs to the containerd.io package, and writing it before the
# install would turn the install into a conffile conflict.

[Unit]
Requires=homelab-persist.target
After=homelab-persist.target

[Service]
ExecStart=
ExecStart=/usr/bin/containerd --root /data/containerd
