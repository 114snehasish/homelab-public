# Docker starts only once every data disk is mounted and has passed its
# data-guard (#99). /etc/docker/daemon.json puts its data-root on /data/docker.
#
# A drop-in, never an edit: the packaged docker.service is replaced on every
# docker-ce upgrade, and this file is not.
#
# docker.socket is left alone on purpose. Masking it breaks Docker outright
# (docker.service has Requires=docker.socket and runs `dockerd -H fd://`), and
# ordering it After= homelab-persist.target is a dependency cycle (sockets start
# before basic.target; the guard runs after it). Every activation path, the
# socket included, still has to start docker.service, and this file gates that.

[Unit]
Requires=homelab-persist.target
After=homelab-persist.target
